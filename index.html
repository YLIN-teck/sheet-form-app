<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Sheets Web App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f3f4f6;
      margin: 0;
    }
    .form-card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #111827;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #374151;
    }
    input, textarea {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Submit Data</h2>
    <form id="dataForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="3" required></textarea>
      </div>

      <button type="submit" id="submitBtn">Send to Sheet</button>
      <div id="status" class="status-msg"></div>
    </form>
  </div>

  <script>
    // Replace with your Google Apps Script Web App URL from Step 2
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    const form = document.getElementById("dataForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusDiv = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      statusDiv.textContent = "";
      statusDiv.className = "status-msg";

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value,
      };

      try {
        // Use mode: 'no-cors' if your browser flags CORS from Google Apps Script redirects
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: JSON.stringify(payload),
        });

        statusDiv.textContent = "Data submitted successfully!";
        statusDiv.classList.add("success");
        form.reset();
      } catch (err) {
        statusDiv.textContent = "Failed to submit. Check console for details.";
        statusDiv.classList.add("error");
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send to Sheet";
      }
    });
  </script>
</body>
</html>
